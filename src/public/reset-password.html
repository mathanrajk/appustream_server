<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d14" />
    <link rel="icon" href="logo.png" type="image/png" />
    <link rel="stylesheet" href="style.css" />
    <title>Confirm Password - Tunexa</title>
  </head>
  <body>
    <main class="page">
      <header class="brand">
        <img class="brand-logo" src="logo.png" alt="Tunexa" />
      </header>

      <h1 id="loader">Please wait…</h1>

      <section id="container">
        <div class="card-head">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </span>
          <h2>Confirm Password</h2>
          <p class="subtitle">Choose a new password for your Tunexa account</p>
        </div>

        <form id="form">
          <div class="notification-container" id="error" role="alert"></div>
          <div class="notification-container" id="success" role="status"></div>

          <div class="form-group">
            <label for="password">New Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter new password"
              autocomplete="new-password"
            />
            <p class="hint">8+ characters with uppercase, lowercase, a number &amp; one of @$!%*?&amp;</p>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm New Password</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              placeholder="Re-enter new password"
              autocomplete="new-password"
            />
          </div>

          <button id="submit" type="submit">Reset Password</button>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
